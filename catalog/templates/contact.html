{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm">
        <div class="card-body">
          <h3 class="card-title mb-4">Свяжитесь с нами</h3>

          {% if success %}
            <div class="alert alert-success">
              Спасибо! Ваше сообщение успешно отправлено.
            </div>
          {% endif %}

          <form method="post">
            {% csrf_token %}
            <div class="mb-3">
              <label for="name" class="form-label">Имя</label>
              <input type="text" class="form-control" id="name" name="name" placeholder="Введите ваше имя" required>
            </div>
            <div class="mb-3">
              <label for="phone" class="form-label">Телефон</label>
              <input type="text" class="form-control" id="phone" name="phone" placeholder="+7 (999) 000-00-00" required>
            </div>
            <div class="mb-3">
              <label for="message" class="form-label">Сообщение</label>
              <textarea class="form-control" id="message" name="message" rows="3" placeholder="Ваш вопрос или сообщение" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary w-100">Отправить</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
